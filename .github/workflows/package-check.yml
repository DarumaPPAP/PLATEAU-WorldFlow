name: Package check

on:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    name: Package validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout v4
        with:
          persist-credentials: false
      - name: Validate package and tracked files
        run: python3 tools/validate_package.py
